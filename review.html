<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مراجعة أوراق الاستبيان</title>
<style>
:root{color-scheme:light;--ink:#1b2932;--muted:#74838d;--line:#e3e9ec;--primary:#28645f;--primary-soft:#e9f2f1;--success:#237650;--warning:#9a681d;--danger:#b33f47;--surface:#fff;--canvas:#f4f6f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(57,139,130,.3);outline-offset:2px}
.layout{min-height:100vh;display:grid;grid-template-columns:265px minmax(0,1fr);direction:rtl}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 15px;border-left:1px solid var(--line);background:#fff}
.side h1{margin:0 0 4px;font-size:16px;letter-spacing:-.02em}
.side:before{content:"QUESTIONNAIRE REVIEW";display:block;margin:0 0 7px;color:var(--primary);font:800 8px/1.4 Arial,sans-serif;letter-spacing:.12em}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;border:1px solid #dce4e7;border-radius:8px;background:#fff;color:#53636d;font-size:9px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:#bdd0cd;background:#f7faf9}
.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}
.btn.primary:hover{border-color:#1e504c;background:#1e504c}
.btn:disabled{opacity:.4;cursor:not-allowed}
#sheet-list{display:grid;gap:6px;color:var(--muted);font-size:9px}
.sheet{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:52px;padding:9px 11px;border:1px solid #e7ecee;border-radius:9px;background:#fff;color:#40515a;text-align:right;cursor:pointer}
.sheet:hover{border-color:#bfd3cf;background:#fafcfb}
.sheet.active{border-color:#9fc3bd;background:#edf6f4;color:#245d58;box-shadow:inset -3px 0 0 var(--primary)}
.sheet small{color:#8a979e;font-size:8px}
.main{min-width:0;overflow:auto;padding:23px clamp(14px,2.5vw,34px) 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:1500px;margin:0 auto 15px}
.top h2{margin:0;font-size:19px;letter-spacing:-.025em}
.muted{color:var(--muted);font-size:10px}
#counter{padding:5px 9px;border:1px solid var(--line);border-radius:20px;background:#fff}
.alert{max-width:1500px;margin:0 auto 12px;padding:11px 13px;border:1px solid #f0dfc2;border-radius:10px;background:#fcf7eb;color:#886023;font-size:9px;line-height:1.8}
.content{display:grid;grid-template-columns:minmax(270px,.92fr) minmax(350px,1.08fr);gap:14px;align-items:start;max-width:1500px;margin:0 auto}
.images,.answers{min-width:0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 8px 25px rgba(20,39,50,.035)}
.images h3,.answers h3{margin:0 0 12px;font-size:12px}
.pageimg{margin:0 0 14px;text-align:center}
.pageimg:last-child{margin-bottom:0}
.pageimg img{display:block;width:100%;max-height:720px;object-fit:contain;border:1px solid #e0e6e9;border-radius:7px;background:#f7f9fa}
.pageimg figcaption{margin:7px;color:#7e8d96;font-size:9px}
.qcard{margin:9px 0;padding:12px;border:1px solid #e7ecee;border-radius:10px;background:#fff}
.qtitle{margin:0 0 10px;color:#30424c;font-size:10px;font-weight:750;line-height:1.8}
.options{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:center;gap:7px;min-height:35px;padding:7px 10px;border:1px solid #dce4e7;border-radius:8px;background:#fff;color:#52616a;font-size:9px;line-height:1.5;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{border-color:#b5cbc7}
.opt:has(input:checked){border-color:#9cc6bf;background:#edf6f4;color:#245b56}
.opt input{width:14px;height:14px;margin:0;accent-color:var(--primary)}
.score{margin-top:8px;color:#8b979e;font-size:8px;line-height:1.7}
.qcard textarea{display:block;width:100%;min-height:80px;resize:vertical;padding:9px;border:1px solid #dce4e7;border-radius:8px;background:#fbfcfc;color:#354750;font-size:10px;line-height:1.7}
.status{margin:11px 0 0;padding:10px 11px;border:1px solid #e5eaed;border-radius:9px;background:#f5f7f8;color:#687780;font-size:9px;line-height:1.8;white-space:pre-wrap}
.status.ok{border-color:#dcece3;background:#f1f8f3;color:#2d714e}
.status.bad{border-color:#f0dedf;background:#fff6f6;color:#a8424a}
.empty{max-width:650px;margin:10vh auto;padding:44px 22px;border:1px dashed #d6e0e3;border-radius:15px;background:#fff;color:#7b8a93;text-align:center;font-size:10px;line-height:1.9}
.empty:before{content:"✓";display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:20px;font-weight:800}
.savebar{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #edf0f2}
.savebar .btn.primary{min-width:140px;min-height:40px}
@media(max-width:1020px){.layout{grid-template-columns:210px minmax(0,1fr)}.content{grid-template-columns:1fr}.images{order:2}.images,.answers{padding:13px}}
@media(max-width:650px){
  .layout{display:flex;flex-direction:column}
  .side{position:static;height:auto;max-height:none;padding:12px;border-left:0;border-bottom:1px solid var(--line)}
  .side:before{margin-bottom:4px}
  .side h1{font-size:14px}
  .tools{margin:9px 0}
  #sheet-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .sheet{min-width:125px;width:auto;flex:0 0 auto}
  .main{overflow:visible;padding:14px 10px 24px}
  .top{align-items:flex-start}
  .top h2{font-size:16px}
  .content{display:flex;flex-direction:column}
  .answers,.images{width:100%}
  .images{order:2}
  .savebar .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <h1>الأوراق المعالجة</h1>
    <div class="tools"><button class="btn" id="reload">تحديث</button><button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
    <div id="sheet-list" class="muted">جارٍ تحميل الأوراق...</div>
  </aside>
  <main class="main">
    <div class="top"><h2 id="heading">مراجعة الإجابات</h2><span class="muted" id="counter"></span></div>
    <div id="notice"></div>
    <div id="empty" class="empty">عالج صور الاستبيانات أولاً، ثم ستظهر الأوراق هنا لمراجعة الإجابات.</div>
    <div id="workbench" hidden>
      <div class="content">
        <section class="images"><h3>صور صفحات الورقة</h3><div id="page-images"></div></section>
        <section class="answers"><h3>الإجابات المكتشفة — راجعها ثم احفظ</h3><div id="question-list"></div>
          <div class="savebar"><button class="btn primary" id="save">حفظ المراجعة</button><button class="btn" id="skip">الورقة التالية</button></div><div id="save-status" class="status" hidden></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let layout=null,sheets=[],index=-1,current=null,answers={};
async function request(url,options={}){const r=await fetch(url,options);let d;try{d=await r.json()}catch{throw new Error('استجابة غير صالحة من الخادم.')}if(!r.ok||d.ok===false)throw new Error(d.error||'تعذر إكمال الطلب.');return d;}
function setStatus(text,kind=''){const el=$('#save-status');el.hidden=!text;el.textContent=text;el.className='status '+kind;}
async function init(){try{layout=await request('/api/layout');await reloadSheets();}catch(e){$('#empty').textContent=e.message;}}
async function reloadSheets(keepId=null){sheets=await request('/api/sheets');drawSheetList();if(!sheets.length){index=-1;current=null;$('#empty').hidden=false;$('#workbench').hidden=true;$('#counter').textContent='';return;}let target=keepId?sheets.findIndex(x=>x.id===keepId):-1;if(target<0)target=sheets.findIndex(x=>!x.reviewed);if(target<0)target=0;await openSheet(target);}
function drawSheetList(){$('#sheet-list').innerHTML=sheets.length?sheets.map((s,i)=>`<button class="sheet ${i===index?'active':''}" data-index="${i}">ورقة ${esc(s.id)}<small>${s.reviewed?'تمت مراجعتها':'تحتاج مراجعة'}${s.error?' · خطأ محاذاة':''}</small></button>`).join(''):'لا توجد أوراق بعد.';document.querySelectorAll('.sheet').forEach(b=>b.addEventListener('click',()=>openSheet(Number(b.dataset.index))));}
async function openSheet(i){if(i<0||i>=sheets.length)return;index=i;current=await request(`/api/sheet/${i}`);answers={};const stored=current.saved||{};for(const q of layout.questions){if(q.type==='choice'){const detected=current.q?.[q.id]||{};let sel=stored[q.id]?.sel;if(sel===undefined){sel=(detected.status==='review'&&detected.why==='none')?null:detected.sel??null;}answers[q.id]={sel};}else answers[q.id]={text:stored[q.id]?.text||''};}render();}
function render(){if(!current)return;$('#empty').hidden=true;$('#workbench').hidden=false;$('#heading').textContent=`مراجعة الورقة ${current.id}`;$('#counter').textContent=`${index+1} من ${sheets.length}`;$('#notice').innerHTML=current.error?`<div class="alert">${esc(current.error)} — قد تكون هذه الصورة غير محاذاة، راجعها بعناية.</div>`:'';drawSheetList();
const imgs=current.pages||[];$('#page-images').innerHTML=imgs.map((name,i)=>`<figure class="pageimg"><figcaption>الصفحة ${i+1}${(current.scanned_pages||[]).includes(i)?' · ممسوحة':' · صفحة غير ممسوحة'}</figcaption><img loading="lazy" src="/img/${encodeURIComponent(name)}" alt="صورة الصفحة ${i+1}"></figure>`).join('');
$('#question-list').innerHTML=layout.questions.map((q,qi)=>{const a=answers[q.id]||{};if(q.type==='choice'){const detect=current.q?.[q.id]||{};const options=`<label class="opt"><input type="radio" name="q_${qi}" data-qid="${esc(q.id)}" value="-1" ${a.sel===null?'checked':''}><span>لا توجد إجابة</span></label>`+(q.options||[]).map((o,oi)=>`<label class="opt"><input type="radio" name="q_${qi}" data-qid="${esc(q.id)}" value="${oi}" ${a.sel===oi?'checked':''}><span>${esc(o.label)}</span></label>`).join('');const state=detect.status==='review'?'تحتاج تأكيداً':detect.status==='ok'?'قراءة آلية':'لم تُقرأ';const scores=Array.isArray(detect.scores)?` · درجات الحبر: ${detect.scores.join(' / ')}`:'';return `<div class="qcard"><p class="qtitle">${esc(q.text)}</p><div class="options">${options}</div><div class="score">حالة القراءة: ${state}${scores}</div></div>`;}return `<div class="qcard"><p class="qtitle">${esc(q.text)}</p><textarea data-text-qid="${esc(q.id)}" placeholder="أدخل الإجابة المكتوبة يدوياً">${esc(a.text||'')}</textarea><div class="score">هذا السؤال النصي لا يستخرج نصه تلقائياً بواسطة OMR؛ أدخل الإجابة بعد مراجعة الصورة.</div></div>`;}).join('');
document.querySelectorAll('input[data-qid]').forEach(el=>el.addEventListener('change',()=>{answers[el.dataset.qid].sel=Number(el.value)<0?null:Number(el.value);}));document.querySelectorAll('textarea[data-text-qid]').forEach(el=>el.addEventListener('input',()=>{answers[el.dataset.textQid].text=el.value;}));setStatus('');$('#prev').disabled=index<=0;$('#next').disabled=index>=sheets.length-1;}
async function move(delta){const next=index+delta;if(next>=0&&next<sheets.length)await openSheet(next);}
$('#reload').addEventListener('click',()=>reloadSheets(current?.id));$('#prev').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));$('#skip').addEventListener('click',()=>move(1));
$('#save').addEventListener('click',async()=>{try{$('#save').disabled=true;await request(`/api/sheet/${index}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});setStatus('تم حفظ إجابات هذه الورقة وتحديث ملف النتائج.','ok');await reloadSheets(current.id);}catch(e){setStatus(e.message,'bad');}finally{$('#save').disabled=false;}});
init();
</script>
</body>
</html>
